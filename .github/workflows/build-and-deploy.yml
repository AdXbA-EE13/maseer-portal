# =============================================================================
# Maseer Portal - Build and Deploy to GitHub Pages
# =============================================================================
# This workflow builds and deploys the Maseer Portal frontend to GitHub Pages.
# It automatically deploys on every push to main and supports manual triggers.
#
# Features:
#   - Injects PAT_TOKEN into config.js for GitHub API access
#   - Uses GitHub's official Pages deployment actions
#   - Afghanistan-accessible (no blocked services)
# =============================================================================

name: Build and Deploy to GitHub Pages

on:
  # Trigger on push to main branch
  push:
    branches: [main, master]
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'assets/**'
      - '.github/workflows/build-and-deploy.yml'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Sets permissions for the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Build Job
  # ===========================================================================
  build:
    name: Build Site
    runs-on: ubuntu-latest
    
    steps:
      # -----------------------------------------------------------------------
      # Checkout repository code
      # -----------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Setup Pages
      # -----------------------------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # Enable static site generator
          static_site_generator: none

      # -----------------------------------------------------------------------
      # Inject Configuration
      # -----------------------------------------------------------------------
      # This step injects the PAT_TOKEN into config.js for GitHub API access
      # The token is exposed to the frontend via window.GITHUB_CONFIG
      # -----------------------------------------------------------------------
      - name: Inject GitHub Configuration
        run: |
          echo "Injecting GitHub configuration..."
          
          # Create or update config.js with GitHub credentials
          CONFIG_FILE="assets/js/config.js"
          
          # Ensure the directory exists
          mkdir -p assets/js
          
          # Create config.js with injected token
          cat > $CONFIG_FILE << 'EOF'
          // =============================================================================
          // Maseer Portal - Configuration
          // =============================================================================
          // This file is auto-generated by GitHub Actions
          // DO NOT commit this file with real tokens to the repository
          // =============================================================================
          
          (function() {
              'use strict';
              
              // GitHub API Configuration
              window.GITHUB_CONFIG = {
                  // Personal Access Token for GitHub API
                  // This token is injected at build time by GitHub Actions
                  // It has limited scope: issues:write, contents:read
                  PAT_TOKEN: '${{ secrets.PAT_TOKEN }}',
                  
                  // Repository configuration
                  REPO_OWNER: 'maseer-ac',
                  REPO_NAME: 'maseer-engine',
                  
                  // API endpoints
                  API_BASE_URL: 'https://api.github.com',
                  
                  // Issue template
                  ISSUE_TEMPLATE: 'new-client-form.yml',
                  ISSUE_LABELS: ['new-client', 'registration'],
                  
                  // Feature flags
                  FEATURES: {
                      ENABLE_GITHUB_SUBMISSION: true,
                      ENABLE_FILE_UPLOAD: true,
                      ENABLE_PREVIEW: true
                  }
              };
              
              // Application Configuration
              window.APP_CONFIG = {
                  // App metadata
                  APP_NAME: 'Maseer Portal',
                  APP_VERSION: '1.0.0',
                  
                  // UI Configuration
                  UI: {
                      PRIMARY_COLOR: '#1a5f2a',
                      SECONDARY_COLOR: '#f4a261',
                      MAX_LOGO_SIZE_MB: 2,
                      SUPPORTED_LOGO_FORMATS: ['image/png', 'image/jpeg', 'image/jpg', 'image/webp']
                  },
                  
                  // Validation rules
                  VALIDATION: {
                      MIN_BRAND_NAME_LENGTH: 2,
                      MAX_BRAND_NAME_LENGTH: 100,
                      PHONE_REGEX: /^[\+]?[0-9\s\-\(\)]{8,20}$/,
                      EMAIL_REGEX: /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                  }
              };
              
              // Environment indicator
              window.ENVIRONMENT = '${{ github.event.inputs.environment || 'production' }}';
              
              console.log('[Maseer Portal] Configuration loaded');
              console.log('[Maseer Portal] Environment:', window.ENVIRONMENT);
          })();
          EOF
          
          echo "Configuration injected successfully"
          
          # Verify the file was created
          if [ -f "$CONFIG_FILE" ]; then
              echo "✅ Config file created: $CONFIG_FILE"
              # Show file size (should be small, token is masked in logs)
              ls -lh $CONFIG_FILE
          else
              echo "❌ Failed to create config file"
              exit 1
          fi

      # -----------------------------------------------------------------------
      # Validate HTML
      # -----------------------------------------------------------------------
      - name: Validate HTML Files
        run: |
          echo "Validating HTML files..."
          
          # Check if index.html exists
          if [ ! -f "index.html" ]; then
              echo "❌ index.html not found in root directory"
              exit 1
          fi
          
          # Basic validation - check for required tags
          if ! grep -q "<html" index.html; then
              echo "❌ Missing <html> tag in index.html"
              exit 1
          fi
          
          if ! grep -q "</html>" index.html; then
              echo "❌ Missing closing </html> tag in index.html"
              exit 1
          fi
          
          echo "✅ HTML validation passed"

      # -----------------------------------------------------------------------
      # Prepare build artifacts
      # -----------------------------------------------------------------------
      - name: Prepare Build Artifacts
        run: |
          echo "Preparing build artifacts..."
          
          # Create build directory
          mkdir -p _site
          
          # Copy all files to build directory
          cp -r *.html _site/ 2>/dev/null || true
          cp -r *.css _site/ 2>/dev/null || true
          cp -r *.js _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true
          cp -r images _site/ 2>/dev/null || true
          cp -r fonts _site/ 2>/dev/null || true
          
          # List build contents
          echo "Build directory contents:"
          ls -la _site/

      # -----------------------------------------------------------------------
      # Upload build artifacts
      # -----------------------------------------------------------------------
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # ===========================================================================
  # Deploy Job
  # ===========================================================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # -----------------------------------------------------------------------
      # Deploy to GitHub Pages
      # -----------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # -----------------------------------------------------------------------
      # Post-deployment notification
      # -----------------------------------------------------------------------
      - name: Notify Deployment Success
        run: |
          echo "🚀 Deployment successful!"
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
          
          # Create deployment summary
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
