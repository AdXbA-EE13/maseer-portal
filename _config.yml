# ============================================
# MASEER PORTAL - JEKYLL CONFIGURATION
# GitHub Pages Configuration
# ============================================

# Site Settings
title: "Maseer Portal"
description: "Client Registration Portal for Digital Presence Management"
baseurl: "/maseer-portal"  # Repository name for GitHub Pages
url: "https://adXba-eei3.github.io"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - README.md
  - LICENSE
  - "*.gemspec"

# Include files (ensure these are copied)
include:
  - assets
  - "assets/**/*"

# Default settings for all pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
      lang: en

# Language settings
languages:
  - code: en
    name: English
    dir: ltr
  - code: fa
    name: فارسی
    dir: rtl
  - code: ps
    name: پښتو
    dir: rtl

# Author Information
author:
  name: "Maseer Digital"
  email: "support@maseer.digital"

# Social Links
social:
  github: "AdXbA-EEI3"

# SEO Settings
twitter:
  username: ""
  card: "summary_large_image"

# Analytics (optional - can be configured)
google_analytics: ""

# Custom Variables
app_version: "1.0.0"
support_email: "support@maseer.digital"
